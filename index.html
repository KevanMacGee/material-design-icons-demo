<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, curated collection of Material Design icons for easy reference.">
    <title>Material Design Icons Showcase</title>
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Material Icons</h1>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode">
                    <span class="material-symbols-outlined theme-icon">light_mode</span>
                </button>
            </div>
            <p class="subtitle">A personally curated collection of Material Design icons from Google, categorized for easy access and integration into your projects.</p>
        </header>

        <main>
            <!-- Financial Category -->
            <section class="category">
                <div class="category-header">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">wallet</span>
                    <h2 class="category-title">Financial</h2>
                </div>
                
                <div class="icon-grid">
                    <!-- Account Balance Icon -->
                    <div class="icon-card" title="account_balance">
                        <div class="icon-wrapper">
                            <span class="material-symbols-outlined">account_balance</span>
                        </div>
                        <span class="icon-name">account_balance</span>
                    </div>

                    <!-- Monitoring Icon -->
                    <div class="icon-card" title="monitoring">
                        <div class="icon-wrapper">
                            <span class="material-symbols-outlined">monitoring</span>
                        </div>
                        <span class="icon-name">monitoring</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Optional script to copy icon name on click -->
    <script>
        document.querySelectorAll('.icon-card').forEach(card => {
            card.addEventListener('click', () => {
                const iconName = card.querySelector('.icon-name').textContent;
                navigator.clipboard.writeText(iconName).then(() => {
                    const originalText = card.querySelector('.icon-name').textContent;
                    card.querySelector('.icon-name').textContent = 'Copied!';
                    setTimeout(() => {
                        card.querySelector('.icon-name').textContent = originalText;
                    }, 1500);
                });
            });
        });

        // Theme toggle logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('.theme-icon');
        
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.textContent = 'light_mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = 'dark_mode';
            }
        });
    </script>
</body>
</html>
