<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Material Icon Collection</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  >

  <script>
    (() => {
      const savedTheme = localStorage.getItem("material-icon-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (prefersDark ? "dark" : "light");

      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <style>
    :root {
      color-scheme: light;

      --background: #f4f6f8;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-solid: #ffffff;
      --surface-hover: #f8fafc;
      --foreground: #17202b;
      --muted-foreground: #687386;
      --border: rgba(23, 32, 43, 0.1);
      --border-strong: rgba(23, 32, 43, 0.17);
      --accent: #1267d6;
      --accent-soft: rgba(18, 103, 214, 0.1);
      --shadow:
        0 1px 2px rgba(23, 32, 43, 0.04),
        0 12px 34px rgba(23, 32, 43, 0.06);
      --header-glow: rgba(71, 139, 230, 0.16);
      --radius-large: 22px;
      --radius-medium: 16px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --background: #101317;
      --surface: rgba(28, 33, 40, 0.84);
      --surface-solid: #1b2027;
      --surface-hover: #222933;
      --foreground: #f2f5f8;
      --muted-foreground: #a4afbd;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #7eb4ff;
      --accent-soft: rgba(126, 180, 255, 0.13);
      --shadow:
        0 1px 2px rgba(0, 0, 0, 0.22),
        0 18px 48px rgba(0, 0, 0, 0.2);
      --header-glow: rgba(58, 117, 194, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 18% 0%,
          var(--header-glow),
          transparent 32rem
        ),
        var(--background);
      color: var(--foreground);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      transition:
        background-color 180ms ease,
        color 180ms ease;
    }

    button {
      font: inherit;
    }

    .page-shell {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 96px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 44px;
      margin-bottom: 56px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 6px 8px 6px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted-foreground);
      box-shadow: 0 6px 20px rgba(23, 32, 43, 0.04);
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        border-color 160ms ease,
        background-color 160ms ease,
        color 160ms ease;
    }

    .theme-toggle:hover {
      border-color: var(--border-strong);
      color: var(--foreground);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .theme-toggle-label {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .theme-toggle-track {
      position: relative;
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--border);
    }

    .theme-toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-solid);
      color: var(--accent);
      box-shadow: 0 2px 7px rgba(23, 32, 43, 0.16);
      transition: transform 180ms ease;
    }

    :root[data-theme="dark"] .theme-toggle-thumb {
      transform: translateX(20px);
    }

    .theme-toggle-thumb .material-symbols-rounded {
      font-size: 15px;
    }

    .page-header {
      max-width: 760px;
      margin-bottom: 64px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin: 0 0 18px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2.75rem, 7vw, 5.6rem);
      line-height: 0.93;
      letter-spacing: -0.067em;
      text-wrap: balance;
    }

    .intro {
      max-width: 570px;
      margin: 25px 0 0;
      color: var(--muted-foreground);
      font-size: clamp(1rem, 2vw, 1.08rem);
      line-height: 1.72;
    }

    .category + .category {
      margin-top: 68px;
    }

    .category-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    .category-heading-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .category-title {
      margin: 0;
      font-size: 1.42rem;
      letter-spacing: -0.035em;
    }

    .category-count {
      color: var(--muted-foreground);
      font-size: 0.82rem;
      font-weight: 650;
    }

    .category-rule {
      flex: 1;
      height: 1px;
      margin-bottom: 7px;
      background: var(--border);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 16px;
    }

    .icon-card {
      position: relative;
      display: flex;
      min-height: 172px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px 18px 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        transform 170ms ease,
        border-color 170ms ease,
        background-color 170ms ease,
        box-shadow 170ms ease;
    }

    .icon-card::before {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        145deg,
        var(--accent-soft),
        transparent 45%
      );
      content: "";
      opacity: 0;
      pointer-events: none;
      transition: opacity 170ms ease;
    }

    .icon-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      background: var(--surface-hover);
      box-shadow:
        0 2px 4px rgba(23, 32, 43, 0.05),
        0 18px 42px rgba(23, 32, 43, 0.1);
    }

    .icon-card:hover::before {
      opacity: 1;
    }

    .icon-symbol {
      position: relative;
      display: grid;
      width: 74px;
      height: 74px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      background: var(--surface-solid);
      color: var(--foreground);
    }

    .icon-symbol .material-symbols-rounded {
      font-size: 42px;
      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 48;
    }

    .icon-name {
      position: relative;
      color: var(--muted-foreground);
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.76rem;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(100% - 28px, 1160px);
        padding-top: 24px;
      }

      .top-bar {
        margin-bottom: 42px;
      }

      .page-header {
        margin-bottom: 50px;
      }

      .category-header {
        align-items: center;
      }

      .category-rule {
        display: none;
      }

      .icon-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .icon-card {
        min-height: 154px;
        padding-inline: 12px;
      }

      .icon-symbol {
        width: 64px;
        height: 64px;
      }

      .icon-symbol .material-symbols-rounded {
        font-size: 38px;
      }
    }

    @media (max-width: 390px) {
      .theme-toggle-label {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <div class="top-bar">
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <span class="theme-toggle-label" id="theme-toggle-label">Light mode</span>

        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <span class="material-symbols-rounded" id="theme-toggle-icon">
              light_mode
            </span>
          </span>
        </span>
      </button>
    </div>

    <header class="page-header">
      <p class="eyebrow">Personal reference</p>
      <h1>Material Icon Collection</h1>
      <p class="intro">
        A curated collection of Google Material icons, organized into simple
        categories for quick reference.
      </p>
    </header>

    <div id="icon-categories"></div>
  </main>

  <script>
    /*
      Add new icons here.

      Google Material icon names use underscores in the HTML ligature,
      even when a website displays the name with hyphens.
    */
    const iconCategories = [
      {
        name: "Financial",
        icons: [
          "account_balance",
          "monitoring"
        ]
      }
    ];

    const categoriesContainer = document.querySelector("#icon-categories");
    const themeToggle = document.querySelector("#theme-toggle");
    const themeToggleLabel = document.querySelector("#theme-toggle-label");
    const themeToggleIcon = document.querySelector("#theme-toggle-icon");

    function formatIconName(iconName) {
      return iconName.replaceAll("_", " ");
    }

    function updateThemeToggle(theme) {
      const isDark = theme === "dark";

      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeToggle.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );

      themeToggleLabel.textContent = isDark ? "Dark mode" : "Light mode";
      themeToggleIcon.textContent = isDark ? "dark_mode" : "light_mode";
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("material-icon-theme", theme);
      updateThemeToggle(theme);
    }

    function renderIconCategories() {
      categoriesContainer.innerHTML = iconCategories
        .map((category) => {
          const iconCards = category.icons
            .map(
              (iconName) => `
                <article class="icon-card" title="${formatIconName(iconName)}">
                  <div class="icon-symbol" aria-hidden="true">
                    <span class="material-symbols-rounded">
                      ${iconName}
                    </span>
                  </div>

                  <span class="icon-name">${iconName}</span>
                </article>
              `
            )
            .join("");

          const iconCountLabel =
            category.icons.length === 1
              ? "1 icon"
              : `${category.icons.length} icons`;

          return `
            <section class="category">
              <div class="category-header">
                <div class="category-heading-group">
                  <h2 class="category-title">${category.name}</h2>
                  <span class="category-count">${iconCountLabel}</span>
                </div>

                <div class="category-rule" aria-hidden="true"></div>
              </div>

              <div class="icon-grid">
                ${iconCards}
              </div>
            </section>
          `;
        })
        .join("");
    }

    themeToggle.addEventListener("click", () => {
      const currentTheme = document.documentElement.dataset.theme;
      setTheme(currentTheme === "dark" ? "light" : "dark");
    });

    updateThemeToggle(document.documentElement.dataset.theme);
    renderIconCategories();
  </script>
</body>
</html>
